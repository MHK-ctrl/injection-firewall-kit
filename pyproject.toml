[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "injection-firewall-kit"
version = "0.1.0"
description = "Defensive toolkit for AI apps: labeled prompt-injection test corpus, detectors, sanitizers, tool gating and a benchmark harness"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "injection-firewall-kit contributors" }]
keywords = ["prompt-injection", "llm-security", "ai-agents", "defense", "red-teaming"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "jsonschema>=4.0"]

[project.urls]
Homepage = "https://github.com/MHK-ctrl/injection-firewall-kit"

[project.scripts]
ifk = "firewall.cli:main"

[tool.setuptools]
packages = ["firewall", "firewall.detectors", "harness", "harness.adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"harness/adapters/*.py" = ["F401"]
