name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 22.04 rather than -latest: the newest image no longer ships a Python 3.9 build.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Corpus schema validation
        run: python -c "from tests.corpus_utils import validate_corpus; validate_corpus()"
      - name: Tests
        run: pytest -q
      - name: Benchmark smoke run
        run: ifk bench --json /tmp/benchmark.json
